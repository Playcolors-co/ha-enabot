name: Build engine image (standalone)

# Builds the add-on as a plain amd64 Docker image and publishes it to GHCR, so HA Container / Core
# users can run the engine without the add-on (see STANDALONE.md). Manual, or on an engine-v* tag.
on:
  workflow_dispatch:
  push:
    tags:
      - "engine-v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/playcolors-co/ebo-engine
          tags: |
            type=raw,value=latest
            type=match,pattern=engine-v(.*),group=1
            type=sha

      - name: Build and push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: ./ebo
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
