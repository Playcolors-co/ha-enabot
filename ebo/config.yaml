name: EBO for Home Assistant (unofficial)
version: "0.26.0"
slug: ebo
description: Unofficial, free community add-on to manage Enabot EBO robots in Home Assistant (panel, camera, entities). Not affiliated with Enabot.
url: https://github.com/Playcolors-co/ha-enabot
# Reverse-engineered, unofficial, undocumented cloud API: mark as experimental.
stage: experimental
# The Agora SDK is built for x86_64 (glibc) only. HAOS on Proxmox/NUC is amd64.
arch:
  - amd64
startup: application
boot: auto
# RTSP video (Generic Camera). 8554 = single robot / first robot; 8555-8557 = extra robots
# when the account has more than one (one RTSP port per robot).
ports:
  8554/tcp: 8554
  8555/tcp: 8555
  8556/tcp: 8556
  8557/tcp: 8557
  # data API for the native HA integration (token-guarded)
  8098/tcp: 8098
ports_description:
  8554/tcp: "Camera video stream (robot 1) — internal, no need to change"
  8555/tcp: "Camera video stream (robot 2, if any) — internal"
  8556/tcp: "Camera video stream (robot 3, if any) — internal"
  8557/tcp: "Camera video stream (robot 4, if any) — internal"
  8098/tcp: "Data API for the Enabot integration — internal, no need to change"
# Our base is python:3.11-slim (not an HA base image with s6): disable HA init.
init: false
# No external MQTT: the internal bus runs on a mosquitto bound to 127.0.0.1 inside the container,
# so the user needs no broker and no MQTT integration. Entities are native (the EBO integration).
# Allow querying the Supervisor for the host IP (to show the exact RTSP camera URL).
hassio_api: true
# Write access to Home Assistant's config dir, so the add-on can install its companion integration
# into /homeassistant/custom_components/ebo (no HACS needed). Only that folder is touched.
map:
  - homeassistant_config:rw
# The Ingress panel edits this add-on's own options (log level, video quality…) and restarts it.
hassio_role: manager
# Sidebar web panel (Zigbee2MQTT-style): manage all robots from one place. Served via Ingress.
ingress: true
ingress_port: 8099
panel_icon: mdi:robot
panel_title: EBO
# Only the account login lives here; EVERYTHING else (region, host, video, audio, quality, log
# level…) is managed from the Enabot panel and stored in /data/panel.json.
options:
  email: ""
  password: ""
  payload_key: ""
  sign_key: ""
schema:
  email: str
  password: password
  payload_key: password
  sign_key: password
  # token the companion integration uses to read this add-on's data API. Auto-generated if empty;
  # persisted here so the integration can read it via the Supervisor. You don't need to set it.
  api_token: str?
