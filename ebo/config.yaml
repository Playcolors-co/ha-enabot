name: EBO for Home Assistant (unofficial)
version: "0.26.93"
slug: ebo
description: Unofficial, free community add-on to manage Enabot EBO robots in Home Assistant (panel, camera, entities). Not affiliated with Enabot.
url: https://github.com/Playcolors-co/ha-enabot
# Reverse-engineered, unofficial, undocumented cloud API: mark as experimental.
stage: experimental
# The Agora SDK is built for x86_64 (glibc) only. HAOS on Proxmox/NUC is amd64.
arch:
  - amd64
startup: application
boot: auto
# Only the ports the OUTSIDE world (your browser) must reach are host-mapped. RTSP (8554…) and HLS
# (8888…) are NOT here: they're internal — the camera entity reaches RTSP over the Docker network by
# the add-on's hostname, and the panel plays HLS through the Ingress proxy. Only WebRTC needs the host
# (the browser connects directly for the fluid drive video), plus the integration data API.
ports:
  # data API for the native HA integration (token-guarded)
  8098/tcp: 8098
  # WebRTC (WHEP) for the panel's fullscreen 'drive' view — TRULY fluid ~200 ms video. The browser
  # connects directly here for ICE/media (that's why this one MUST be exposed). One per robot
  # (8189 = robot 1 … 8192 = robot 4); needs BOTH tcp (signalling) and udp (media).
  8189/tcp: 8189
  8189/udp: 8189
  8190/tcp: 8190
  8190/udp: 8190
  8191/tcp: 8191
  8191/udp: 8191
  8192/tcp: 8192
  8192/udp: 8192
  # MCP server for AI agents (only listens when the 'mcp' option is ON; bearer-token guarded)
  8100/tcp: 8100
ports_description:
  8098/tcp: "Data API for the Enabot integration — internal, no need to change"
  8100/tcp: "MCP server for AI agents — only active when the 'Allow AI agents (MCP)' option is on"
  8189/tcp: "WebRTC drive video (robot 1) — signalling; no need to change"
  8189/udp: "WebRTC drive video (robot 1) — media/ICE; no need to change"
# Our base is python:3.11-slim (not an HA base image with s6): disable HA init.
init: false
# No external MQTT: the internal bus runs on a mosquitto bound to 127.0.0.1 inside the container,
# so the user needs no broker and no MQTT integration. Entities are native (the EBO integration).
# Allow querying the Supervisor for the host IP (to show the exact RTSP camera URL).
hassio_api: true
# Write access to Home Assistant's config dir, so the add-on can install its companion integration
# into /homeassistant/custom_components/ebo (no HACS needed). Only that folder is touched.
map:
  - homeassistant_config:rw
# manager role: the panel can restart the add-on (after pairing a new robot) and read add-on info.
hassio_role: manager
# Sidebar web panel (Zigbee2MQTT-style): manage all robots from one place. Served via Ingress.
ingress: true
ingress_port: 8099
panel_icon: mdi:robot
panel_title: EBO
# Show the sidebar panel to NON-admin users too (Home Assistant hides add-on panels from
# non-admins by default). The panel is how you drive the robot, so family members / kids'
# accounts need it — not just admins. Ingress still authenticates every request as that user.
panel_admin: false
# ALL add-on settings live here (Configuration tab): your account login + connection, and the
# advanced audio/video processing options. Per-robot settings (video quality, eyes, volume, speed…)
# are NOT here — you change those on the robot's page in the panel; they're sent to the robot.
options:
  # --- account / login ---
  email: ""
  password: ""
  payload_key: ""
  sign_key: ""
  region: "GB"
  host: "ebox-eu.enabotserverintl.com"
  robot_id: 0
  # --- add-on audio/video processing (advanced — the defaults are good; the drive view auto-tunes) ---
  video: true
  audio: true
  talk: false
  video_max_height: 720
  video_fps: 20
  video_bitrate: 2500
  video_preset: ultrafast
  audio_codec: "8"
  # Minutes of inactivity after which the add-on leaves the robot's session so it can fall asleep
  # (the ZZ eyes), like closing the official app. 0 = never sleep while the add-on runs.
  standby_after_minutes: 5
  # AI/MCP: expose the robot to MCP-capable AI agents (look → decide → move). OFF by default:
  # the server only starts when this is on, so it costs nothing if you don't use it.
  mcp: false
  log_level: info
schema:
  email: str
  password: password
  payload_key: password
  sign_key: password
  # account login region and server host (match your Enabot account); robot_id 0 = all robots
  region: str
  host: str
  robot_id: int
  # add-on audio/video pipeline (advanced)
  video: bool
  audio: bool
  talk: bool
  video_max_height: int
  video_fps: int
  video_bitrate: int
  video_preset: list(ultrafast|superfast|veryfast|faster|fast)?
  audio_codec: list(auto|0|8|9)?
  # let the robot sleep after N minutes with no commands (0 = never)
  standby_after_minutes: int
  # AI agents (MCP): off by default — the server only runs when this is on
  mcp: bool
  # add-on log verbosity: info (default) | debug (chatty) | warning (only problems)
  log_level: list(debug|info|warning)?
  # token the companion integration uses to read this add-on's data API. Auto-generated if empty;
  # persisted here so the integration can read it via the Supervisor. You don't need to set it.
  api_token: str?
